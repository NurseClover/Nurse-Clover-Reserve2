<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>챕터 카드로 단어 보기</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fefefe;
      padding: 20px;
      text-align: center;
    }
    h1 {
      margin-bottom: 30px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      max-width: 900px;
      margin: auto;
    }
    .card {
      background-color: #f0f8ff;
      padding: 20px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .card:hover {
      transform: scale(1.03);
    }
    .back-button {
      margin-top: 30px;
      display: inline-block;
      padding: 10px 20px;
      background: #ddd;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>📘 챕터별 의학용어 보기</h1>
  <div id="app"></div>

  <script>
    const data = [
      [
   "감각기계": [
    { "eng": "Eye", "kor": "눈", "desc": "" },
    { "eng": "Retina", "kor": "망막", "desc": "" },
    { "eng": "Cornea", "kor": "각막", "desc": "" },
    { "eng": "Lens", "kor": "수정체", "desc": "" },
    { "eng": "Iris", "kor": "홍채", "desc": "" },
    { "eng": "Pupil", "kor": "동공", "desc": "" },
    { "eng": "Optic Nerve", "kor": "시신경", "desc": "" },
    { "eng": "Fovea", "kor": "중심와", "desc": "" },
    { "eng": "Macula", "kor": "황반", "desc": "" },
    { "eng": "Visual Acuity", "kor": "시력", "desc": "" },
    { "eng": "Ear", "kor": "귀", "desc": "" },
    { "eng": "Cochlea", "kor": "달팽이관", "desc": "" },
    { "eng": "Ossicles", "kor": "이소골", "desc": "" },
    { "eng": "Malleus", "kor": "망치뼈", "desc": "" },
    { "eng": "Incus", "kor": "모루뼈", "desc": "" },
    { "eng": "Stapes", "kor": "등자뼈", "desc": "" },
    { "eng": "Eustachian Tube", "kor": "유스타키오관", "desc": "" },
    { "eng": "Vestibular System", "kor": "전정기관", "desc": "" },
    { "eng": "Olfactory Receptor", "kor": "후각수용기", "desc": "" },
    { "eng": "Taste Bud", "kor": "미뢰", "desc": "" },
    { "eng": "Photoreceptor", "kor": "광수용체", "desc": "" },
    { "eng": "Rod", "kor": "간상세포", "desc": "" },
    { "eng": "Cone", "kor": "원추세포", "desc": "" },
    { "eng": "Tactile Sensation", "kor": "촉각", "desc": "" },
    { "eng": "Proprioception", "kor": "고유수용감각", "desc": "" },
    { "eng": "Pupil Reflex", "kor": "동공반사", "desc": "" },
    { "eng": "Accommodation", "kor": "조절", "desc": "" },
    { "eng": "Glaucoma", "kor": "녹내장", "desc": "" },
    { "eng": "Cataract", "kor": "백내장", "desc": "" },
    { "eng": "Otitis Media", "kor": "중이염", "desc": "" },
    { "eng": "Tinnitus", "kor": "이명", "desc": "" },
    { "eng": "Vertigo", "kor": "현훈", "desc": "" },
    { "eng": "Smell", "kor": "후각", "desc": "" },
    { "eng": "Taste", "kor": "미각", "desc": "" },
    { "eng": "Touch", "kor": "촉각", "desc": "" },
    { "eng": "Nociceptor", "kor": "통각수용기", "desc": "" }
  ],
      "간호기록": [
        { eng: "before / ante", kor: "이전", desc: "어떤 시점보다 이전을 의미" },
        { eng: "blood pressure", kor: "혈압", desc: "혈관 내 압력" }
      ],
      "기본용어": [
        { eng: "patient", kor: "환자", desc: "치료를 받는 사람" },
        { eng: "treatment", kor: "치료", desc: "병을 낫게 하는 행위" }
      ]
    ];

    const app = document.getElementById("app");

    function showChapters() {
      app.innerHTML = '<div class="grid">' + 
        Object.keys(data).map(ch => `
          <div class="card" onclick="showWords('${ch}')">${ch}</div>
        `).join('') +
      '</div>';
    }

    function showWords(chapter) {
      const words = data[chapter];
      app.innerHTML = `
        <h2>📂 ${chapter}</h2>
        <div class="grid">
          ${words.map(w => `
            <div class="card" onclick="toggleMeaning(this)">
              <div><strong>${w.eng}</strong></div>
              <div>${w.kor}</div>
              <div class="meaning" style="display:none; margin-top:10px; font-size:0.9em; color:#555;">${w.desc}</div>
            </div>
          `).join('')}
        </div>
        <div class="back-button" onclick="showChapters()">🔙 챕터로 돌아가기</div>
      `;
    }

    function toggleMeaning(cardEl) {
      const meaning = cardEl.querySelector('.meaning');
      meaning.style.display = meaning.style.display === 'block' ? 'none' : 'block';
    }

    showChapters(); // 초기 화면
  </script>
</body>
</html>
