<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>챕터 카드로 단어 보기</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fefefe;
      padding: 20px;
      text-align: center;
    }
    h1 {
      margin-bottom: 30px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      max-width: 900px;
      margin: auto;
    }
    .card {
      background-color: #f0f8ff;
      padding: 20px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .card:hover {
      transform: scale(1.03);
    }
    .back-button {
      margin-top: 30px;
      display: inline-block;
      padding: 10px 20px;
      background: #ddd;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>📘 챕터별 의학용어 보기</h1>
  <div id="app"></div>

  <script>
    const data = {
      "진료부서": [
        { eng: "OPD (outpatient department)", kor: "외래", desc: "외래 진료를 받는 부서" },
        { eng: "IPD (inpatient department)", kor: "입원", desc: "입원 환자 관리 부서" }
      ],
      "간호기록": [
        { eng: "before / ante", kor: "이전", desc: "어떤 시점보다 이전을 의미" },
        { eng: "blood pressure", kor: "혈압", desc: "혈관 내 압력" }
      ],
      "기본용어": [
        { eng: "patient", kor: "환자", desc: "치료를 받는 사람" },
        { eng: "treatment", kor: "치료", desc: "병을 낫게 하는 행위" }
      ]
    };

    const app = document.getElementById("app");

    function showChapters() {
      app.innerHTML = '<div class="grid">' + 
        Object.keys(data).map(ch => `
          <div class="card" onclick="showWords('${ch}')">${ch}</div>
        `).join('') +
      '</div>';
    }

    function showWords(chapter) {
      const words = data[chapter];
      app.innerHTML = `
        <h2>📂 ${chapter}</h2>
        <div class="grid">
          ${words.map(w => `
            <div class="card" onclick="toggleMeaning(this)">
              <div><strong>${w.eng}</strong></div>
              <div>${w.kor}</div>
              <div class="meaning" style="display:none; margin-top:10px; font-size:0.9em; color:#555;">${w.desc}</div>
            </div>
          `).join('')}
        </div>
        <div class="back-button" onclick="showChapters()">🔙 챕터로 돌아가기</div>
      `;
    }

    function toggleMeaning(cardEl) {
      const meaning = cardEl.querySelector('.meaning');
      meaning.style.display = meaning.style.display === 'block' ? 'none' : 'block';
    }

    showChapters(); // 초기 화면
  </script>
</body>
</html>
