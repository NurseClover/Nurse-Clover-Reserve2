<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>의학용어 챕터 카드 보기</title>
  <style>
    :root {
      --bg-color: #fffafc;
      --card-bg: #e6f3ff;
      --font-color: #222;
      --accent-color: #4CAF50;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--bg-color);
      color: var(--font-color);
      padding: 20px;
      text-align: center;
      transition: background-color 0.3s, color 0.3s;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 28px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      max-width: 900px;
      margin: auto;
    }

    .card {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s, background-color 0.3s;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .back-button {
      margin-top: 30px;
      display: inline-block;
      padding: 10px 20px;
      background: #ccc;
      border-radius: 6px;
      cursor: pointer;
    }

    .meaning {
      display: none;
      margin-top: 10px;
      font-size: 0.9em;
      color: #555;
      border-top: 1px solid #ccc;
      padding-top: 8px;
    }

    .theme-selector {
      margin: 20px 0;
    }
  </style>
</head>
<body>

  <h1>📘 챕터별 의학용어 보기</h1>

  <div class="theme-selector">
    <label for="themeSelect">🎨 테마 선택:</label>
    <select id="themeSelect" onchange="applyTheme(this.value)">
      <option value="default">기본 (연분홍)</option>
      <option value="sky">하늘</option>
      <option value="dark">다크</option>
    </select>
  </div>

  <div id="app"></div>

  <script>
    // 데이터
    const chapterData = [
      {
        name: "진료부서",
        words: [
          { eng: "OPD (outpatient department)", kor: "외래", desc: "외래 진료 부서" },
          { eng: "IPD (inpatient department)", kor: "입원", desc: "입원 환자 부서" },
          { eng: "ER (emergency room)", kor: "응급실", desc: "응급 환자 대응 부서" }
        ]
      },
      {
        name: "간호기록",
        words: [
          { eng: "before / ante", kor: "이전", desc: "어떤 시점보다 앞" },
          { eng: "after / post", kor: "이후", desc: "어떤 시점 이후" },
          { eng: "blood pressure", kor: "혈압", desc: "혈액이 혈관을 누르는 압력" }
        ]
      },
      {
        name: "기본용어",
        words: [
          { eng: "patient", kor: "환자", desc: "치료를 받는 사람" },
          { eng: "treatment", kor: "치료", desc: "병을 고치는 행위" },
          { eng: "hospital", kor: "병원", desc: "환자를 치료하는 시설" }
        ]
      }
    ];

    const app = document.getElementById("app");

    function showChapters() {
      app.innerHTML = `
        <div class="grid">
          ${chapterData.map(ch => `
            <div class="card" onclick="showWords('${ch.name}')">${ch.name}</div>
          `).join('')}
        </div>
      `;
    }

    function showWords(chapterName) {
      const chapter = chapterData.find(c => c.name === chapterName);
      if (!chapter) return;

      app.innerHTML = `
        <h2>📂 ${chapter.name}</h2>
        <div class="grid">
          ${chapter.words.map(w => `
            <div class="card" onclick="toggleMeaning(this)">
              <div><strong>${w.eng}</strong></div>
              <div>${w.kor}</div>
              <div class="meaning">${w.desc}</div>
            </div>
          `).join('')}
        </div>
        <div class="back-button" onclick="showChapters()">🔙 챕터로 돌아가기</div>
      `;
    }

    function toggleMeaning(cardEl) {
      const m = cardEl.querySelector('.meaning');
      m.style.display = m.style.display === 'block' ? 'none' : 'block';
    }

    // 테마 설정
    function applyTheme(theme) {
      const root = document.documentElement;
      localStorage.setItem('selectedTheme', theme);

      if (theme === 'sky') {
        root.style.setProperty('--bg-color', '#e0f7ff');
        root.style.setProperty('--card-bg', '#ffffff');
        root.style.setProperty('--font-color', '#003344');
      } else if (theme === 'dark') {
        root.style.setProperty('--bg-color', '#1e1e1e');
        root.style.setProperty('--card-bg', '#2e2e2e');
        root.style.setProperty('--font-color', '#eeeeee');
      } else {
        root.style.setProperty('--bg-color', '#fffafc');
        root.style.setProperty('--card-bg', '#e6f3ff');
        root.style.setProperty('--font-color', '#222');
      }
    }

    // 초기 로딩 시 테마 복원
    window.onload = () => {
      const savedTheme = localStorage.getItem('selectedTheme') || 'default';
      document.getElementById('themeSelect').value = savedTheme;
      applyTheme(savedTheme);
      showChapters();
    };
  </script>

</body>
</html>
