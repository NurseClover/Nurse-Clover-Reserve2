<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>단어 학습</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>단어 학습</h1>
  <label for="chapterSelect">챕터 선택:</label>
  <select id="chapterSelect"></select>
  <div id="termList" class="term-list"></div>

  <script type="module">
    import { getChapters, getTermsByChapter } from './terms.js';

    const chapterSelect = document.getElementById('chapterSelect');
    const termList = document.getElementById('termList');

    async function init() {
      const chapters = await getChapters();
      chapterSelect.innerHTML = chapters
        .map(ch => `<option value="${ch}">${ch}</option>`)
        .join('');
      chapterSelect.addEventListener('change', renderTerms);
      renderTerms();
    }

    async function renderTerms() {
      const chapter = chapterSelect.value;
      const terms = await getTermsByChapter(chapter);
      termList.innerHTML = terms
        .map(t => `<div class="term"><strong>${t.word}</strong>: ${t.meaning}</div>`)
        .join('');
    }

    init();
  </script>
</body>
</html>
